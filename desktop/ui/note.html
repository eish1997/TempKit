<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>便签</title><link rel="stylesheet" href="note.css"></head><body>
<header id="note-header"><span class="note-grip" aria-hidden="true">⠿</span><button id="top" aria-label="置顶便签" title="置顶便签" aria-pressed="false" disabled>置顶</button><button id="more" aria-label="更多便签操作" aria-expanded="false">···</button><button id="hide" aria-label="收起便签">×</button></header>
<div id="note-menu" hidden><button id="delete" aria-label="删除便签" disabled>删除便签</button></div>
<textarea id="text" aria-label="便签内容" placeholder="记点什么…" spellcheck="false"></textarea>
<div id="feedback"><span id="status" role="status"></span><button id="retry" hidden>重试载入</button></div><button id="resize" aria-label="调整便签大小"></button>
<script src="icons.js"></script><script src="overlay-icons.js"></script><script src="note.js"></script></body></html>
